# Thanks to workflow configuration in SagerNet/sing-box
name: Publish Docker Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Source tag/branch to build (default: current ref)"
      image_tags:
        description: "Tags to apply to the image, split by comma (default: latest)"

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/cnily03/r2s-api-proxy
  IS_MAIN_BRANCH: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM_PAIR: ""
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          # - linux/arm/v6
          # - linux/arm/v7
          - linux/arm64
          # - linux/386
          # - linux/ppc64le
          # - linux/riscv64
          # - linux/s390x
    steps:
      - name: Get commit to build
        id: ref
        run: |-
          if [[ -z "${{ github.event.inputs.ref }}" ]]; then
            ref="${{ github.ref_name }}"
          else
            ref="${{ github.event.inputs.ref }}"
          fi
          echo "ref=$ref"
          echo "ref=$ref" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Digest: $digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Get commit to build
        id: ref
        run: |-
          if [[ -z "${{ github.event.inputs.ref }}" ]]; then
            ref="${{ github.ref_name }}"
          else
            ref="${{ github.event.inputs.ref }}"
          fi
          echo "ref=$ref"
          echo "ref=$ref" >> $GITHUB_OUTPUT
          custom_tags="${{ github.event.inputs.image_tags }}"
          if [[ -z "$custom_tags" ]]; then
            custom_tags="latest"
          fi
          echo "custom_tags=$custom_tags"
          echo "custom_tags=$custom_tags" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          IFS=',' read -ra TAGS <<< "${{ steps.ref.outputs.custom_tags }}"
          for tag in "${TAGS[@]}"; do
            args+=(-t "${{ env.REGISTRY_IMAGE }}:$tag")
          done
          if [[ "${{ env.IS_MAIN_BRANCH }}" == "true" ]] && [[ ! " ${TAGS[*]} " =~ " latest " ]]; then
            args+=(-t "${{ env.REGISTRY_IMAGE }}:latest")
          fi
          docker buildx imagetools create \
            "${args[@]}" \
            -t "${{ env.REGISTRY_IMAGE }}:${{ steps.ref.outputs.ref }}" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.ref.outputs.custom_tags }}"
          for tag in "${TAGS[@]}"; do
            docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:$tag
          done
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.ref.outputs.ref }}
          if [[ "${{ env.IS_MAIN_BRANCH }}" == "true" ]] && [[ ! " ${TAGS[*]} " =~ " latest " ]]; then
            docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
          fi